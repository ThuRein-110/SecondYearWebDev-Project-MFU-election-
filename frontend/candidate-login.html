<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFU Election - Candidate Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="public/css/login.css">
    <link rel="stylesheet" href="public/css/responsive.css">
</head>
<body>

<div class="page-shell">

    <div class="hero">
        <div class="logo">
            <i class="fa-solid fa-square-check"></i>
            <span>MFU Election Voting</span>
        </div>
        <p class="subtitle">Candidate Access Portal · MFU Student Election 2024</p>
    </div>

    <div class="login-card login-card--slim">

        <div class="verified">
            <i class="fa-solid fa-user"></i>
            Candidate Access
        </div>

        <h2>Candidate Login</h2>
        <p class="desc">Sign in with your Candidate ID or campaign email.</p>

        <form onsubmit="event.preventDefault(); submitCandidateLogin();">
            <label>Candidate ID or Email</label>
            <input id="candidate-identifier" type="text" placeholder="CAN-001 or name@mfu.ac.th" required autocomplete="off">

            <label>Password</label>
            <input id="candidate-password" type="password" placeholder="Your candidate password" required autocomplete="off">

            <button type="submit" class="btn">
                Sign In
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="alt-actions">
                <a href="login.html">Voter Login</a>
                <a href="admin-login.html">Admin Login</a>
                <a href="register-candidate.html">Register Candidate</a>
            </div>
        </form>
    </div>

    <div class="floating-footer">Need quick support? <a href="mailto:help@mfu.ac.th">help@mfu.ac.th</a></div>
</div>

<script src="public/js/candidate-login.js"></script>
</body>
</html>
