<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/candidate-profile.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="main">

        <a href="voter-dashboard.html">← Back to Candidates</a>

        <!-- PROFILE HEADER -->
        <div class="profile-header">
            <img id="profile-img">

            <div>
                <span class="badge" id="candidate-id"></span>
                <h1 id="name"></h1>
                <p id="tagline"></p>
            </div>
        </div>

        <!-- VISION -->
        <div class="card">
            <h3>Our Shared Vision</h3>
            <p id="vision"></p>
        </div>

        <!-- PILLARS -->
        <div class="card">
            <h3>Core Election Pillars</h3>
            <div id="pillars" class="pillars"></div>
        </div>

        <!-- MANIFESTO -->
        <div class="card">
            <h3>Detailed Manifesto</h3>
            <p id="manifesto"></p>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="vote-panel">

        <h3>Cast Your Vote</h3>

        <div class="vote-box">
            <p>CURRENT STANDING</p>
            <h2 id="votes"></h2>
        </div>

<button id="voteBtn" class="vote-btn">
    🗳️ Vote for Candidate
</button></div>

</div>

<script src="public/js/candidate-profile.js"></script>
<script>
async function vote(candidate_id) {
    const res = await fetch('http://localhost:3000/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ candidate_id })
    });

    const data = await res.json();

    if (data.success) {
        // save selected candidate
        localStorage.setItem("voted_candidate", candidate_id);

        // redirect to receipt page
        window.location.href = "receipt.html";
    } else {
        alert(data.message || "Vote failed");
    }
}
</script>
</body>
</html>
