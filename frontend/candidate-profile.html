<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Profile - MFU Election</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/css/candidate-profile.css">
    <link rel="stylesheet" href="public/css/responsive.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="page-header">
            <a class="back-link" href="voter-dashboard.html#candidates-section">
                <span aria-hidden="true">←</span>
                <span>Back to Candidates</span>
            </a>
            <div class="header-meta">
                <span class="status-chip">Candidate Snapshot</span>
                <span class="status-chip secondary">Voting Open</span>
            </div>
        </header>
        <div class="profile-grid">
            <section class="profile-section">
                <div class="profile-banner">
                    <img id="profile-img" alt="Candidate portrait">
                    <div class="profile-details">
                        <div class="profile-badges">
                            <span class="badge" id="candidate-id"></span>
                            <span class="party-chip" id="party"></span>
                        </div>
                        <div class="name-row">
                            <h1 id="name"></h1>
                            <span class="position-chip" id="position"></span>
                        </div>
                        <p class="tagline" id="tagline"></p>
                        <p class="policy-summary" id="policy-summary"></p>
                    </div>
                </div>
                <div class="content-grid">
                    <div class="info-card">
                        <h3>Vision</h3>
                        <p id="vision"></p>
                    </div>
                    <div class="info-card">
                        <h3>Manifesto</h3>
                        <p id="manifesto"></p>
                    </div>
                </div>
                <div class="info-card pillars-card">
                    <h3>Core Pillars</h3>
                    <div id="pillars" class="pillars"></div>
                </div>
            </section>
            <aside class="vote-section">
                <div class="vote-panel">
                    <h3>Cast Your Vote</h3>
                    <p class="vote-subtitle">Every ballot shapes the MFU experience.</p>
                    <div class="vote-box">
                        <p>Current standing</p>
                        <h2 id="votes">0 Votes</h2>
                        <small id="ranking-text">Live updates ahead</small>
                    </div>
                    <button id="voteBtn" class="vote-btn">
                        🗳️ Vote for Candidate
                    </button>
                    <p id="vote-status" class="vote-status" aria-live="polite"></p>
                </div>
            </aside>
        </div>
    </div>
    <script src="public/js/candidate-avatar.js"></script>
    <script src="public/js/storage-utils.js"></script>
    <script src="public/js/candidate-profile.js"></script>
</body>
</html>
