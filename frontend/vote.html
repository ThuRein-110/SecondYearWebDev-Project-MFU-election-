<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote</title>
    <link rel="stylesheet" href="public/css/vote.css">
</head>
<body>
    <div class="container">
        <h2>Cast Your Vote</h2>
        <div class="candidates" id="candidates"></div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="window.location.href='voter-dashboard.html'">Back to Dashboard</button>
        </div>
        <div class="security-notice">
            <strong>🔒 Voting Security Notice</strong>
            Your vote is anonymous and cannot be changed once submitted. Ensure you are voting for the candidate you intend to support. If you encounter any issues, contact election officials immediately.
        </div>
    </div>
    <script src="public/js/vote.js"></script>
</body>
</html>
