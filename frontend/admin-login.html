<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFU Election - Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="public/css/login.css">
    <link rel="stylesheet" href="public/css/responsive.css">
</head>
<body>

<div class="page-shell page-shell--small">

    <div class="hero">
        <div class="logo">
            <i class="fa-solid fa-square-check"></i>
            <span>MFU Election Voting</span>
        </div>
        <p class="subtitle">University Student Council General Election 2024</p>
    </div>

    <div class="login-card login-card--slim">

        <div class="verified">
            <i class="fa-solid fa-shield-halved"></i>
            SYSTEM SECURE & VERIFIED
        </div>

        <h2>Administrator Access Portal</h2>
        <p class="desc">Manage the MFU Election System securely.</p>

        <form onsubmit="event.preventDefault(); submitAdminLogin();">

            <label>USERNAME</label>
            <input id="admin-username" type="text" placeholder="Admin username" required autocomplete="off" />

            <label>PASSWORD</label>
            <input id="admin-password" type="password" placeholder="Password" required autocomplete="off" />

            <button class="btn">
                Sign In
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="alt-actions">
                <a href="login.html">Voter Login</a>
                <a href="candidate-login.html">Candidate Login</a>
                <a href="register-candidate.html">Register Candidate</a>
            </div>
        </form>

    </div>

</div>

  <script>
    async function submitAdminLogin() {
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value.trim();

      if (!username || !password) {
        alert('Please enter both username and password.');
        return;
      }

      const response = await fetch('/login/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const result = await response.json();
      if (result.success) {
        window.location.href = 'admin-dashboard.html';
      } else {
        alert(result.message || 'Login failed.');
      }
    }
  </script>
</body>
</html>
