<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard - MFU Election</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/css/candidate-dashboard.css">
</head>
<body>
    <div class="header">
        <div class="logo">MFU Election</div>
        <div class="user-info">
            <span>Welcome, Candidate</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <nav>
                <a href="#" class="nav-item active" onclick="showSection('dashboard')">
                    <span>📊</span> Dashboard
                </a>
                <a href="#" class="nav-item" onclick="showSection('profile')">
                    <span>👤</span> Update Profile
                </a>
                <a href="#" class="nav-item" onclick="showSection('results')">
                    <span>📈</span> View Results
                </a>
            </nav>
        </div>
        <div class="main-content">
            <div id="dashboard-section" class="section active">
                <h1>Dashboard Overview</h1>
                <div class="stats-grid" id="stats"></div>
                <div class="quick-actions">
                    <div class="action-card primary" onclick="showSection('profile')">
                        <h3>📝 Update Your Information</h3>
                        <p>Keep your profile current</p>
                    </div>
                    <div class="action-card" onclick="showSection('results')">
                        <h3>📊 View Election Results</h3>
                        <p>See how you're doing</p>
                    </div>
                </div>
            </div>
            <div id="profile-section" class="section">
                <h1>Update Your Information</h1>
                <div class="form-card">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="policy">Your Policy/Platform</label>
                        <textarea id="policy" placeholder="Describe your policies and platform" rows="6"></textarea>
                    </div>
                    <button class="btn-primary" onclick="updateInfo()">Update Information</button>
                </div>
            </div>
            <div id="results-section" class="section">
                <h1>Election Results</h1>
                <div class="results-grid" id="results-list"></div>
            </div>
        </div>
    </div>
    <script src="public/js/candidate-dashboard.js"></script>
</body>
</html>
